# Library exposed by both test applications (tests/apps/js and tests/apps/wasm).
libraries:
  tests:
    modules:
      - libgen_tests
    includes:
      - "libgen_tests.h"
    constants:
      answer: 42
      half: 0.5
      greeting: "hello"
    functions:
      # primitives
      add_ints:
        parameters:
          a: int
          b: int
        return_type: int
      negate_double:
        parameters:
          d: double
        return_type: double
      halve_float:
        parameters:
          f: float
        return_type: float
      add_int64:
        parameters:
          a: int64_t
          b: int64_t
        return_type: int64_t
      next_char:
        parameters:
          c: char
        return_type: char
      sum_unsigned:
        parameters:
          a: uint8_t
          b: uint16_t
          c: uint32_t
        return_type: uint32_t
      double_size:
        parameters:
          n: size_t
        return_type: size_t
      # shortcut for functions without parameters: return type
      get_answer: int
      # shortcut for functions without parameters and return type
      count_call:
      get_call_count:
        return_type: int
      renamed_function:
        original_name: original_function_name
        parameters:
          x: int
        return_type: int
      is_even:
        parameters:
          x: int
        return_type: bool
      bool_to_int:
        parameters:
          b: bool
        return_type: int

      # strings
      string_length:
        parameters:
          s: const char*
        return_type: size_t
      string_checksum:
        parameters:
          s: const char*
        return_type: uint32_t
      string_is_null:
        parameters:
          s: const char*
        return_type: int

      # byte arrays
      bytes_checksum:
        parameters:
          data:
            type: const uint8_t*
            length_parameter: len
          len: size_t
        return_type: uint32_t
      fill_bytes:
        parameters:
          buf:
            type: uint8_t*
            length_parameter: len
          len: size_t
      bytes_is_null:
        parameters:
          data:
            type: const uint8_t*
            length_parameter: len
          len: size_t
        return_type: int

      # function handles
      apply_int_op:
        parameters:
          a: int
          b: int
          op: int_op
        return_type: int
      apply_float_op:
        parameters:
          f: float
          d: double
          op: float_op
        return_type: double
      call_with_bool:
        parameters:
          b: bool
          cb: bool_receiver
        return_type: int
      bool_from_callback:
        parameters:
          x: int
          cb: bool_sender
        return_type: bool
      call_with_string:
        parameters:
          cb: string_receiver
      call_with_strings:
        parameters:
          cb: string_receiver
        return_type: size_t
      call_with_null_string:
        parameters:
          cb: string_receiver
      call_with_bytes:
        parameters:
          cb: bytes_receiver
      call_with_null_bytes:
        parameters:
          cb: bytes_receiver
      call_void_twice:
        parameters:
          cb: void_callback

      # pointer handles
      counter_get:
        parameters:
          index: int
        return_type: counter
      counter_increment:
        parameters:
          c: counter
        return_type: int
      counter_null: counter
      counter_is_null:
        parameters:
          c: counter
        return_type: int
      counter_release:
        parameters:
          c: counter
        return_type: int
      call_with_counter:
        parameters:
          index: int
          cb: counter_receiver
        return_type: int
      increment_from_callback:
        parameters:
          cb: counter_sender
        return_type: int

      # arrays
      sum_int_array:
        parameters:
          values: int[3]
        return_type: int
      sum_double_array:
        parameters:
          values: double[2]
        return_type: double
      call_with_array:
        parameters:
          cb: array_receiver
      count_true:
        parameters:
          values: bool[3]
        return_type: int
      call_with_array_repeatedly:
        parameters:
          times: int
          cb: array_receiver

      # structs
      measurement_checksum:
        parameters:
          m: measurement
        return_type: int32_t
      make_measurement:
        parameters:
          base: int16_t
        return_type: measurement
      call_with_measurement:
        parameters:
          cb: measurement_receiver
      call_with_measurement_repeatedly:
        parameters:
          times: int
          cb: measurement_receiver
      checksum_from_measurement_callback:
        parameters:
          cb: measurement_sender
        return_type: int32_t
      point_dot:
        parameters:
          p: point
        return_type: double
      status_checksum:
        parameters:
          s: status
        return_type: int
      make_status:
        parameters:
          ok: bool
        return_type: status

      # output parameters
      get_count:
        parameters:
          count:
            type: int
            direction: out
        return_type: int
      get_flags:
        parameters:
          flag:
            type: bool
            direction: out
          d:
            type: double
            direction: out
      find_counter:
        parameters:
          index: int
          c:
            type: counter
            direction: out
        return_type: int
      read_measurement:
        parameters:
          base: int16_t
          m:
            type: measurement
            direction: out
        return_type: int
      get_values:
        parameters:
          values:
            type: int[3]
            direction: out
      read_bytes:
        parameters:
          buf:
            type: uint8_t*
            length_parameter: len
            direction: out
          len: size_t
        return_type: size_t
      # void pointers as byte arrays
      void_bytes_checksum:
        parameters:
          data:
            type: const void*
            length_parameter: len
          len: size_t
        return_type: uint32_t
      fill_void_bytes:
        parameters:
          buf:
            type: void*
            length_parameter: len
          len: size_t
      read_void_bytes:
        parameters:
          buf:
            type: void*
            length_parameter: len
            direction: out
          len: size_t
        return_type: size_t
      call_with_void_bytes:
        parameters:
          cb: void_bytes_receiver
      # the generated declaration (const uint8_t* buf) would conflict with the one in libgen_tests.h
      void_buffer_sum:
        declare: false
        parameters:
          buf: const buffer*
        return_type: int

      # struct conversion
      partial_checksum:
        parameters:
          p: partial
        return_type: int
      make_partial:
        parameters:
          a: int
        return_type: partial
      counter_ref_increment:
        parameters:
          r: counter_ref
        return_type: int
      make_counter_ref:
        parameters:
          index: int
        return_type: counter_ref
      envelope_checksum:
        parameters:
          e: envelope
        return_type: int32_t
      make_envelope:
        parameters:
          tag: uint8_t
        return_type: envelope
      read_envelope:
        parameters:
          e:
            type: envelope
            direction: out
      call_with_envelope:
        parameters:
          cb: envelope_receiver
      checksum_from_envelope_callback:
        parameters:
          cb: envelope_sender
        return_type: int32_t
      sum_partials:
        parameters:
          values: partial[2]
        return_type: int
      sum_sizes:
        parameters:
          values: size_t[3]
        return_type: size_t
      get_partials:
        parameters:
          values:
            type: partial[2]
            direction: out

      # allocatable structs
      accumulator_add:
        parameters:
          acc: accumulator*
          value: int
      accumulator_sum:
        parameters:
          acc: const accumulator*
        return_type: int
      accumulator_count:
        parameters:
          acc: const accumulator*
        return_type: int
      accumulator_keep:
        parameters:
          acc: accumulator*
      kept_accumulator_sum: int
      opaque_set:
        parameters:
          o: opaque*
          value: int
      opaque_get:
        parameters:
          o: const opaque*
        return_type: int
      # pointer to a struct that is not allocatable: passed as temporary copy
      measurement_checksum_by_pointer:
        parameters:
          m: const measurement*
        return_type: int32_t
      # named arrays
      buffer_fill:
        parameters:
          buf: buffer*
          value: uint8_t
      buffer_sum:
        parameters:
          buf: const buffer*
        return_type: int
      # pointer to an array that is not allocatable: passed as temporary copy
      samples_sum:
        parameters:
          samples: const samples*
        return_type: int32_t
      measurements_checksum:
        parameters:
          measurements: const measurements*
        return_type: int32_t
      # pointer fields
      scaler_apply:
        parameters:
          s: scaler
          value: int
      make_scaler:
        parameters:
          acc: accumulator*
          factor: int
        return_type: scaler
      view_sum:
        parameters:
          v: view
        return_type: int
      list_sum:
        parameters:
          head: const node*
        return_type: int

    function_handles:
      int_op:
        parameters:
          a: int
          b: int
        return_type: int
      float_op:
        parameters:
          f: float
          d: double
        return_type: double
      bool_receiver:
        parameters:
          b: bool
        return_type: int
      bool_sender:
        parameters:
          x: int
        return_type: bool
      string_receiver:
        parameters:
          s: const char*
      bytes_receiver:
        parameters:
          data:
            type: const uint8_t*
            length_parameter: len
          len: size_t
      void_bytes_receiver:
        parameters:
          data:
            type: const void*
            length_parameter: len
          len: size_t
      void_callback: {}
      array_receiver:
        parameters:
          values: int[3]
      measurement_receiver:
        parameters:
          m: measurement
      measurement_sender:
        return_type: measurement
      counter_receiver:
        parameters:
          c: counter
        return_type: int
      counter_sender:
        return_type: counter
      envelope_receiver:
        parameters:
          e: envelope
      envelope_sender:
        return_type: envelope

    pointer_handles:
      counter:
        type: counter_t*
        max_entries: 5

    structs:
      measurement:
        type: measurement_t
        fields:
          val: int16_t[3]
          unit: uint8_t
          scale: int8_t
      point:
        type: point_t
        fields:
          x: double
          y: double
      status:
        type: status_t
        fields:
          ok: bool
          code: int16_t
      # can be created and freed by the runtime, only sum can be set
      accumulator:
        type: accumulator_t
        allocatable: true
        fields:
          sum: int
      # without exposed fields, and with custom names for creating and freeing
      opaque:
        type: opaque_t
        allocatable:
          new: create_opaque
          free: destroy_opaque
          max_entries: 2
      # pointer fields, referencing instances by handles
      scaler:
        type: scaler_t
        fields:
          factor: int
          acc: accumulator*
      # pointing to an array that is declared later
      view:
        type: view_t
        fields:
          data: const buffer*
      # pointing to its own struct
      node:
        type: node_t
        allocatable: true
        fields:
          value: int
          next: node*
      # only some fields of the C struct are exposed
      partial:
        type: partial_t
        fields:
          a: int
          b: int16_t
      counter_ref:
        type: counter_ref_t
        fields:
          c: counter
          increment: int
      envelope:
        type: envelope_t
        fields:
          tag: uint8_t
          m: measurement
          weight: double
          count: size_t
    arrays:
      # can be created and freed by the runtime
      buffer:
        type: uint8_t[4]
        allocatable: true
      # not allocatable (shortcut for type), only passed as temporary copy
      samples: int32_t[3]
      # array of structs, with custom names for creating and freeing
      measurements:
        type: measurement[2]
        allocatable:
          new: create_measurements
          free: destroy_measurements
          max_entries: 1
